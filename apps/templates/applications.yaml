{{- range .Values.applications }}
{{- $values := $.Values -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s" .name | quote }}
  namespace: {{ .namespace | default "argocd" }}
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: {{ dig "destination" "namespace" .name . | quote }}
    server: {{ $values.spec.destination.server | quote }}
  project: {{ .project | default "default" }}
  source:
    path: {{ .path | default .name | quote }}
    repoURL: {{ $values.spec.source.repoURL }}
    targetRevision: {{ $values.spec.source.targetRevision }}
    {{- with .tool }}
    {{- . | toYaml | nindent 4 }}
    {{- end }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
---
{{ end -}}